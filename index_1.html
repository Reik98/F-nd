<!doctype html>
<html lang="de">
<head>

<style>

:root[data-theme="dark"]{--bg:#0B0B0F;--outer:#000000;--card:#1C1C21;--text:#F5F5F7;--muted:#A6ABB8;--line:#2F3038;--accent-text:#7DB4FF;--soft:#14263F;--shadow:0 6px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--outer);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button,input,textarea{font-family:inherit}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 24px;-webkit-overflow-scrolling:touch}
.bar{flex-shrink:0;padding:12px 20px 14px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:center}
.bar3{gap:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin:22px 0 10px}
h2{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:26px 0 8px;line-height:1.2}
h3{font-size:17px;font-weight:700;margin:20px 0 4px}
.lead{font-size:17px;color:var(--muted);margin:0 0 14px}
.frame{font-size:15px;color:var(--muted);margin:8px 0 10px}
.fine{font-size:13px;color:var(--muted);margin:10px 0 0}
.muted{color:var(--muted)}
.err{color:#C2410C;font-weight:600;font-size:14px}
:root[data-theme="dark"] .err{color:#FDBA74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FDBA74}}
.logo{display:inline-flex;flex-direction:column;background:#0B1220;border-radius:16px;padding:10px 18px 11px;border:1px solid var(--line)}
.lg{font-weight:800;letter-spacing:-1px;line-height:1;color:#fff;font-size:34px}
.ex{color:#0A84FF}
.slogan{margin-top:4px;font-size:12px;font-weight:600;color:#C9D3E6;letter-spacing:.3px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 22px}
.pill{background:var(--soft);color:var(--accent-text);font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px}
.stackbtns{display:flex;flex-direction:column;gap:10px}
.btn{min-height:50px;border-radius:14px;border:0;padding:8px 20px;font-size:17px;font-weight:700;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--accent);color:#fff}
.btn.soft{background:var(--soft);color:var(--accent-text)}
.btn.block{width:100%}
.btn.small{min-height:44px;font-size:15px;padding:6px 14px;margin-top:6px}
.btn:disabled,.rbtn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent-text);font-size:16px;font-weight:700;min-height:44px;cursor:pointer;padding:0 8px}
.linkbtn.left{padding:0;margin-left:-2px}
.topbar .cap{font-size:13px;font-weight:700;color:var(--accent-text);letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase}

.stack{position:relative;height:340px;margin:14px 0 6px}
.swipecard{position:absolute;inset:0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;border:1px solid var(--line)}
.swipecard.back{transform:scale(.94) translateY(14px);opacity:.6}
.ctext{font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.3px;pointer-events:none}

.rbtn{width:64px;height:64px;border-radius:32px;border:0;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);color:var(--muted);cursor:pointer}

.opt{display:block;width:100%;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 18px;font-size:19px;font-weight:700;line-height:1.3;color:var(--text);box-shadow:var(--shadow);cursor:pointer}

.or{text-align:center;color:var(--muted);font-size:14px;margin:10px 0}
.trayitem{display:block;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;color:var(--text);box-shadow:var(--shadow);margin-top:8px;cursor:pointer;min-height:48px}
.trayitem[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pyrbuild{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 6px}
.tier{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tier.open{border-color:var(--accent);background:var(--soft)}
.tl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.tchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}

.nl{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
textarea,input[type=text]{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px;font-size:16px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px}

.prow.r3 .chip{flex:1 1 calc(50% - 8px)}
.prow.r2 .chip{flex:1 1 calc(50% - 8px)}
.prow.r1 .chip{font-size:16px;padding:12px 16px}
.pyr.small .chip{font-size:12px;padding:8px 10px;min-height:38px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:5px}
.vt{display:flex;align-items:center;gap:8px;font-size:18px}
.mline{font-size:15px;margin:6px 0 0}
.bars .brow{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;margin-top:9px;font-size:14px}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.num{text-align:right;font-weight:700}
.mcard .mh{display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.meter{display:flex;gap:4px}
.meter i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--accent)}
details{margin-top:10px}
summary{font-size:14px;font-weight:700;color:var(--accent-text);cursor:pointer;min-height:44px;display:flex;align-items:center}
.code{display:block;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";

const RAW = {
 SB:[['Hier kann ich meine Arbeit selbst einteilen.','Arbeit selbst einteilen'],['Hier darf ich eigene Ideen umsetzen, ohne jedes Mal um Erlaubnis zu fragen.','Eigene Ideen umsetzen'],['Hier entscheide ich weitgehend selbst, wie ich zum Ergebnis komme.','Eigener Lösungsweg'],['Hier kann ich Arbeitszeit und Arbeitsort flexibel wählen.','Zeit und Ort flexibel'],['Hier kann ich mir Themen aussuchen, in die ich mich vertiefe.','Themen selbst wählen']],
 ST:[['Hier bringt fast jede Woche etwas Neues.','Jede Woche Neues'],['Hier bekomme ich Aufgaben, bei denen ich nicht sicher bin, ob ich sie schaffe.','Echte Herausforderungen'],['Hier ist Veränderung normal, Projekte und Abläufe wechseln oft.','Veränderung ist normal'],['Hier probiert man Neues aus, auch wenn es schiefgehen kann.','Neues ausprobieren'],['Hier komme ich regelmäßig in ganz neue Situationen, mit neuen Kunden, Ländern oder Themen.','Neue Situationen']],
 HE:[['Hier macht die Arbeit mir Spaß.','Spaß an der Arbeit'],['Hier wird gemeinsam gelacht und gefeiert.','Gemeinsam feiern'],['Hier kann ich Pausen machen, ohne schlechtes Gewissen.','Pausen ohne Druck'],['Hier ist das Arbeitsumfeld angenehm gestaltet, vom Büro bis zur Ausstattung.','Angenehmes Umfeld'],['Hier ist nach Feierabend wirklich Feierabend, und ich habe Zeit für mein Leben.','Echter Feierabend']],
 LE:[['Hier wird gute Arbeit sichtbar anerkannt.','Anerkennung'],['Hier werde ich an meinen Ergebnissen gemessen.','An Ergebnissen gemessen'],['Hier gelten hohe Qualitätsansprüche.','Hohe Qualität'],['Hier kann ich mich fachlich beweisen und Erfolge vorweisen.','Fachlich beweisen'],['Hier treiben ehrgeizige Ziele das Team an.','Ehrgeizige Ziele']],
 MA:[['Hier kann ich in eine Führungsposition aufsteigen.','Aufstieg in Führung'],['Hier kann ich Entscheidungen mit großer Tragweite beeinflussen.','Große Entscheidungen'],['Hier verdiene ich überdurchschnittlich gut.','Gut verdienen'],['Hier hat meine Stimme Gewicht, wenn es um wichtige Fragen geht.','Meine Stimme zählt'],['Hier bekomme ich Ansehen für meine Position und Verantwortung.','Ansehen und Verantwortung']],
 SI:[['Hier ist mein Arbeitsplatz langfristig sicher.','Sicherer Arbeitsplatz'],['Hier kann ich mich auf ein verlässliches Einkommen verlassen.','Verlässliches Einkommen'],['Hier sind Abläufe und Zuständigkeiten stabil und planbar.','Stabile Abläufe'],['Hier ist das Unternehmen wirtschaftlich solide.','Solides Unternehmen'],['Hier weiß ich, was in den nächsten Monaten auf mich zukommt.','Planbare Zukunft']],
 KO:[['Hier halten sich alle an vereinbarte Regeln.','Regeln einhalten'],['Hier ist klar geregelt, was von mir erwartet wird.','Klare Erwartungen'],['Hier wird auf einen respektvollen Umgangston geachtet, auch wenn es schwierig wird.','Respektvoller Umgang'],['Hier sind Pünktlichkeit und Verbindlichkeit selbstverständlich.','Verbindlichkeit'],['Hier folgt man festgelegten Prozessen, statt jeden Fall neu zu erfinden.','Feste Prozesse']],
 TR:[['Hier werden bewährte Arbeitsweisen gepflegt.','Bewährte Arbeitsweisen'],['Hier ist die Firmengeschichte lebendig und wird wertgeschätzt.','Firmengeschichte'],['Hier schätzt man Erfahrung mehr als das Neueste.','Erfahrung zählt'],['Hier gibt es feste Rituale und Bräuche, etwa Feste und Jubiläen.','Rituale und Bräuche'],['Hier bleibt das Unternehmen seinen Wurzeln treu, auch wenn sich der Markt verändert.','Den Wurzeln treu']],
 WO:[['Hier unterstützen sich Kolleginnen und Kollegen gegenseitig.','Gegenseitige Hilfe'],['Hier ist das Team eine Gemeinschaft, auf die ich mich verlassen kann.','Team als Gemeinschaft'],['Hier interessiert sich die Führung für mein Wohlergehen.','Führung kümmert sich'],['Hier wird man als Neue oder Neuer von Anfang an eingebunden und unterstützt.','Gute Einarbeitung'],['Hier kann ich auch Schwächen zeigen, ohne dafür bewertet zu werden.','Schwächen zeigen dürfen']],
 UN:[['Hier trägt meine Arbeit zu einer besseren Gesellschaft bei.','Sinn für die Gesellschaft'],['Hier gehen wir sorgsam mit Umwelt und Ressourcen um.','Umwelt und Ressourcen'],['Hier wird Chancengleichheit aktiv gefördert.','Chancengleichheit'],['Hier ist Vielfalt im Team ausdrücklich erwünscht.','Vielfalt im Team'],['Hier bedenken wir die Folgen unseres Handelns für andere Länder und künftige Generationen.','Folgen für die Welt']]
};
const ORDER = ['SB','ST','HE','LE','MA','SI','KO','TR','WO','UN'];
const GROUPS = [
 {n:'Offenheit für Neues', col:'#0A6CFF'},
 {n:'Erfolg und Genuss', col:'#C2410C'},
 {n:'Sicherheit und Ordnung', col:'#1F7A34'},
 {n:'Miteinander und Sinn', col:'#7E22CE'}
];
const VALS = [
 {c:'SB', n:'Selbstbestimmung', g:0, d:'Eigenständig entscheiden und den eigenen Weg gehen.', w:'Freiräume, Vertrauen und Eigenverantwortung.'},
 {c:'ST', n:'Stimulation', g:0, d:'Abwechslung, Neues und Herausforderungen.', w:'Wechselnde Aufgaben, neue Projekte und Tempo.'},
 {c:'HE', n:'Hedonismus', g:1, d:'Freude, Genuss und Erholung.', w:'Gute Atmosphäre und eine Balance zwischen Arbeit und Leben.'},
 {c:'LE', n:'Leistung', g:1, d:'Etwas erreichen und sich beweisen.', w:'Klare Ziele, messbare Ergebnisse und Anerkennung.'},
 {c:'MA', n:'Macht', g:1, d:'Einfluss nehmen, Verantwortung tragen und vorankommen.', w:'Aufstiegswege, Mitsprache und gute Bezahlung.'},
 {c:'SI', n:'Sicherheit', g:2, d:'Stabilität, Verlässlichkeit und Planbarkeit.', w:'Sichere Stellen, klare Abläufe und eine planbare Zukunft.'},
 {c:'KO', n:'Konformität', g:2, d:'Regeln, Verbindlichkeit und respektvoller Umgang.', w:'Klare Zuständigkeiten, feste Prozesse und verlässliche Absprachen.'},
 {c:'TR', n:'Tradition', g:2, d:'Bewährtes, Herkunft und gewachsene Kultur.', w:'Betriebe mit Geschichte, Erfahrung und festen Bräuchen.'},
 {c:'WO', n:'Wohlwollen', g:3, d:'Zusammenhalt und das Wohl der Kolleginnen und Kollegen.', w:'Teamgeist, Unterstützung und Vertrauen.'},
 {c:'UN', n:'Universalismus', g:3, d:'Etwas Gutes für Menschen, Gesellschaft und Umwelt bewirken.', w:'Sinnstiftende Aufgaben, Nachhaltigkeit und Vielfalt.'}
];
const VBY = {}; VALS.forEach(v => VBY[v.c] = v);
const CARDS = []; ORDER.forEach(c => RAW[c].forEach((x, i) => CARDS.push({id: c + (i + 1), v: c, t: x[0], s: x[1]})));
const BYID = {}; CARDS.forEach(c => BYID[c.id] = c);
const W = [4, 2, 2, 1, 1, 1, 1];
const T_HIGH = 0.62, T_MID = 0.38;

const DEMO = [
 {n:'Betrieb A', b:'Maschinenbau · Mittelstand', ids:['LE3','SI1','KO2','TR3','SI3','LE4','WO1']},
 {n:'Betrieb B', b:'Elektrohandwerk · kleiner Betrieb', ids:['WO2','TR3','KO4','SI2','WO3','LE3','SB1']},
 {n:'Betrieb C', b:'Pflege und Soziales', ids:['WO1','UN1','WO3','WO4','KO3','UN3','SI2']},
 {n:'Betrieb D', b:'Digitalagentur', ids:['SB2','ST1','SB4','HE1','LE4','ST4','MA4']},
 {n:'Betrieb E', b:'Nachhaltige Technik · Start-up', ids:['UN2','ST3','SB2','UN1','LE5','WO2','UN5']}
];
const TEAM_SAMPLE = [
 ['WO2','TR3','KO4','SI2','WO3','LE3','SB1'],['WO1','SI1','TR3','KO2','WO4','LE3','SI3'],
 ['LE3','KO4','WO2','SI2','TR1','WO3','SB1'],['WO2','WO1','SI2','TR3','LE4','KO4','SB1'],
 ['SB1','WO2','LE3','SI1','TR3','WO3','HE5'],['WO3','KO2','SI1','LE3','WO4','TR3','HE1'],
 ['WO2','LE3','TR3','SI2','KO4','SB4','WO1'],['KO4','WO2','SI1','TR1','LE3','WO3','SB1']
];

function vecOf(ids) { const v = {}; ORDER.forEach(c => v[c] = 0); ids.forEach((id, i) => { v[BYID[id].v] += W[i]; }); return v; }
function cosine(a, b) { let d = 0, na = 0, nb = 0; ORDER.forEach(c => { d += a[c] * b[c]; na += a[c] * a[c]; nb += b[c] * b[c]; }); return na && nb ? d / Math.sqrt(na * nb) : 0; }
function levelOf(c) { return c >= T_HIGH ? 2 : (c >= T_MID ? 1 : 0); }
function codeOf(role, ids) { return 'FIND1-' + (role === 'bewerber' ? 'B' : 'M') + '-' + ids.join('.'); }
function parseCode(s) {
  const m = /^FIND1-([BM])-([A-Z]{2}[1-5](?:\.[A-Z]{2}[1-5]){6})$/.exec(String(s || '').trim().toUpperCase());
  if (!m) return null;
  const ids = m[2].split('.');
  if (new Set(ids).size !== 7 || ids.some(i => !BYID[i])) return null;
  return {role: m[1] === 'B' ? 'bewerber' : 'mitarbeiter', ids};
}
function compareVec(a, b) {
  const cos = cosine(a, b);
  const ov = ORDER.map(c => ({c, o: Math.min(a[c], b[c]), d: Math.abs(a[c] - b[c])}));
  const common = ov.filter(x => x.o > 0).sort((x, y) => y.o - x.o).slice(0, 2).map(x => x.c);
  const diff = ov.slice().sort((x, y) => y.d - x.d)[0];
  return {cos, level: levelOf(cos), common, diff: diff && diff.d > 0 ? diff.c : null};
}
function teamAgg(lists) {
  const n = lists.length;
  const cardScore = {}; CARDS.forEach(c => cardScore[c.id] = 0);
  const sum = {}; ORDER.forEach(c => sum[c] = 0);
  const vecs = lists.map(ids => vecOf(ids));
  lists.forEach(ids => ids.forEach((id, i) => { cardScore[id] += W[i]; }));
  vecs.forEach(v => ORDER.forEach(c => { sum[c] += v[c]; }));
  const avg = {}; ORDER.forEach(c => avg[c] = n ? sum[c] / n : 0);
  const top = CARDS.map(c => c.id).filter(id => cardScore[id] > 0).sort((a, b) => cardScore[b] - cardScore[a] || (a < b ? -1 : 1)).slice(0, 7);
  let agree = 0; vecs.forEach(v => { agree += cosine(v, avg); }); agree = n ? agree / n : 0;
  return {n, avg, top, agree};
}

const CAP = 18, MINSEL = 10;
const S = {screen:'start', mode:'sort', trimmed:false, role:'bewerber', deck:[], i:0, yes:[], no:[], hist:[], pick:{}, remaining:[], duels:{}, pair:null, dhist:[], tiers:{top:[], mid:[], base:[]}, sel:null, notes:{}, cmp:'', team:''};
const app = document.getElementById('app');
let busy = false;

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function icon(html) { const s = document.createElement('span'); s.innerHTML = html; s.style.display = 'inline-flex'; s.setAttribute('aria-hidden', 'true'); return s; }
const IC = {
  x: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  undo: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>'
};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function btn(label, cls, onclick, extra) { return h('button', Object.assign({type: 'button', class: 'btn ' + cls, onclick}, extra || {}), label); }
function logo() { return h('div', {class: 'logo'}, h('div', {class: 'lg'}, h('span', {}, 'F'), h('span', {class: 'ex'}, '!'), h('span', {}, 'ND')), h('div', {class: 'slogan'}, "Don't search. Find.")); }

/* ---------- Runde 1 ---------- */

function decide(imp) {
  const c = S.deck[S.i];

  S.hist.push({id: c.id, imp});
  (imp ? S.yes : S.no).push(c.id);
  S.i++;
  if (S.i >= S.deck.length) finishRound1(); else render();
}
function undo1() {
  if (busy) return;

}
function afterSort() {

}
function finishRound1() { if (trimMode()) startRound2(); else afterSort(); }
function startTrim() {
  S.mode = 'trim';
  S.deck = shuffle(S.yes.map(id => BYID[id])); S.i = 0; S.yes = []; S.no = []; S.hist = [];
  go('round1');
}

      h('p', {class: 'lead'}, 'Du hast ' + S.yes.length + ' von ' + CARDS.length + ' Karten gewählt. Das sind mehr als ' + CAP + '. Du siehst deine Auswahl jetzt noch einmal und behältst höchstens ' + CAP + ' Karten, nämlich die, die dir am wichtigsten sind.')),
    h('div', {class: 'bar'}, btn('Los geht’s', 'primary block', startTrim))

}
function swipeOut(card, imp) {
  if (busy) return;
  if (blocked(imp)) { card.style.transition = 'transform .2s'; card.style.transform = ''; card.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0); return; }
  busy = true;
  card.style.transition = 'transform .22s, opacity .22s';
  card.style.transform = 'translateX(' + (imp ? '' : '-') + '140%) rotate(' + (imp ? 18 : -18) + 'deg)';
  card.style.opacity = '0';
  setTimeout(() => { busy = false; decide(imp); }, 200);
}
function attachSwipe(card) {
  let sx = 0, dx = 0, drag = false;
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.addEventListener('pointerdown', e => { if (busy) return; drag = true; sx = e.clientX; dx = 0; try { card.setPointerCapture(e.pointerId); } catch (x) {} card.style.transition = 'none'; });
  card.addEventListener('pointermove', e => {
    if (!drag) return; dx = e.clientX - sx;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!drag) return; drag = false;
    if (Math.abs(dx) > 90) swipeOut(card, dx > 0);
    else { card.style.transition = 'transform .2s'; card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}

/* ---------- Auffüllen ---------- */

/* ---------- Runde 2 ---------- */
function pickPair() {
  const pool = shuffle(S.remaining.slice()).sort((a, b) => S.duels[a] - S.duels[b]);
  const a = pool[0], others = pool.slice(1), minD = S.duels[others[0]];
  const cand = others.filter(id => S.duels[id] === minD);
  const diff = cand.filter(id => BYID[id].v !== BYID[a].v);
  const p = diff.length ? diff : cand;
  const b = p[Math.floor(Math.random() * p.length)];
  return Math.random() < 0.5 ? [a, b] : [b, a];
}
function startRound2() {
  S.remaining = S.yes.slice(); S.duels = {}; S.remaining.forEach(id => S.duels[id] = 0); S.dhist = [];
  S.tiers = {top: [], mid: [], base: []}; S.sel = null;

  S.pair = pickPair(); go('round2');
}
function choose(win, lose) {
  S.dhist.push({remaining: S.remaining.slice(), duels: Object.assign({}, S.duels), pair: S.pair});
  S.remaining = S.remaining.filter(x => x !== lose); S.duels[win]++;

}
function undo2() { const l = S.dhist.pop(); if (!l) return; S.remaining = l.remaining; S.duels = l.duels; S.pair = l.pair; render(); }

  const out = h('div', {id: 'teamout'});
  const ta = h('textarea', {id: 'teamin', rows: '6', spellcheck: 'false', placeholder: 'FIND1-M-…\nFIND1-M-…', oninput: e => { S.team = e.target.value; }}, S.team);
  const run = () => {
    out.replaceChildren();
    const lines = S.team.split(/\n+/).map(s => s.trim()).filter(Boolean);
    let bad = 0, bew = 0; const lists = [];
    lines.forEach(l => { const p = parseCode(l); if (!p) bad++; else if (p.role === 'bewerber') bew++; else lists.push(p.ids); });
    const notes = [bad ? bad + ' Zeile(n) nicht lesbar' : null, bew ? bew + ' Bewerber-Code(s) ignoriert' : null].filter(Boolean).join(', ');
    if (lists.length < 5) { out.append(h('div', {class: 'box'}, h('strong', {}, 'Noch zu wenige Teilnehmende'), h('p', {class: 'mline'}, 'Gültig: ' + lists.length + '. Zum Schutz Einzelner erscheint die Auswertung erst ab 5 Teilnehmenden.'), notes ? h('p', {class: 'fine'}, notes) : null)); return; }
    const t = teamAgg(lists), ids = t.top;
    const aq = t.n >= 20 ? 'hoch' : (t.n >= 10 ? 'mittel' : 'gering'), ag = t.agree >= 0.8 ? 'hoch' : (t.agree >= 0.65 ? 'mittel' : 'gering');
    out.append(
      h('h2', {}, 'Eure Firmenpyramide'),
      h('div', {class: 'box'}, pyramidView(ids), legend()),
      h('div', {class: 'box'}, h('p', {class: 'mline'}, h('strong', {}, 'Basiert auf ' + t.n + ' Mitarbeitenden. '), 'Aussagekraft: ' + aq + '. Einigkeit im Team: ' + ag + '.'), notes ? h('p', {class: 'fine'}, notes) : null, h('p', {class: 'fine'}, 'Einzelergebnisse werden nie angezeigt. Schwellen für Aussagekraft und Einigkeit sind Demo-Werte.')),
      h('h2', {}, 'Werte im Team'),
      h('div', {class: 'box'}, barsView(t.avg, 'Durchschnittliche Punkte pro Person (zusammen 12).'), legend()));
  };
  return [h('div', {class: 'screen'},
    h('button', {type: 'button', class: 'linkbtn left', onclick: () => go('start')}, '← Zurück'),
    h('h1', {}, 'Team auswerten'),
    h('p', {class: 'lead'}, 'Für Betriebe: Jede Person im Team macht den Test mit „Ich arbeite in einem Betrieb“ und schickt dir ihren Ergebnis-Code. Füge die Codes hier ein, einen pro Zeile.'),
    h('label', {for: 'teamin', class: 'nl'}, 'Ergebnis-Codes'), ta,
    h('div', {class: 'stackbtns', style: 'margin-top:12px'},
      btn('Beispieldaten einfügen', 'soft block', () => { S.team = TEAM_SAMPLE.map(x => codeOf('mitarbeiter', x)).join('\n'); ta.value = S.team; }),
      btn('Auswerten', 'primary block', run)),
    out)];
}

render();

</script>
